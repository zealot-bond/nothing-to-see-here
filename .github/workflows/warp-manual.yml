name: warp-manual

# Rotates Cloudflare WARP registrations to obtain fresh egress IPs.
#
# Uses the official warp-cli (registration delete + registration new) rather
# than the raw /v0a4005/reg API, because the raw API path appeared to reuse the
# same egress IPv4 across registrations. Each GitHub Actions job gets its own
# fresh VM (fresh /etc/machine-id), and each iteration inside a job performs a
# full device re-registration, so every account should carry a distinct egress
# IP. The egress IP is measured and stored so the effect can be verified.

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel jobs (each on its own fresh VM)'
        required: true
        default: '8'
      accounts_per_worker:
        description: 'Full re-registrations per job'
        required: true
        default: '3'

permissions:
  contents: write

concurrency:
  group: warp-manual
  cancel-in-progress: false

env:
  ACCOUNTS_DIR: accounts

jobs:
  plan:
    name: plan-matrix
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.make.outputs.worker }}
    steps:
      - id: make
        env:
          WORKERS: ${{ inputs.workers }}
        run: |
          set -euo pipefail
          n=$(echo "$WORKERS" | tr -cd '0-9')
          [ -z "$n" ] && n=8
          [ "$n" -gt 20 ] && n=20
          list=""
          i=0
          while [ "$i" -lt "$n" ]; do
            list="$list${list:+,}$i"
            i=$((i + 1))
          done
          echo "worker=[$list]" >> "$GITHUB_OUTPUT"

  mint:
    needs: plan
    name: mint-${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.worker) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cloudflare WARP CLI
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl gnupg lsb-release iproute2 wireguard-tools
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo warp-cli --accept-tos --version || true

      - name: Rotate registrations
        env:
          WORKER: ${{ matrix.worker }}
          PER_WORKER: ${{ fromJSON(inputs.accounts_per_worker) }}
        run: |
          set -uo pipefail
          sudo systemctl enable dbus >/dev/null 2>&1 || true
          sudo systemctl start dbus  >/dev/null 2>&1 || true
          sudo warp-svc >/var/log/warp-svc.log 2>&1 &
          for i in $(seq 1 20); do
            sudo warp-cli --accept-tos status >/dev/null 2>&1 && break
            sleep 2
          done
          sudo warp-cli --accept-tos mode warp || true
          sudo warp-cli --accept-tos tunnel protocol wireguard || true
          mkdir -p "data"
          echo "worker $WORKER starting, $PER_WORKER re-registrations"

          cat > harvest.js <<'NODEEOF'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");

          const PER_WORKER = Number(process.env.PER_WORKER || 3);
          const WORKER = process.env.WORKER || "0";
          const out = [];

          const warp = (args, allowFail) => {
            try {
              return execFileSync("sudo", ["warp-cli", "--accept-tos", ...args], {
                encoding: "utf8", timeout: 60000,
              });
            } catch (e) {
              if (!allowFail) throw e;
              return String((e.stdout || "") + (e.stderr || ""));
            }
          };

          // The exact method from alztrk/opencode-ip-rotator rotator.py:
          // a full device re-registration, not a reconnect.
          const rotate = () => {
            warp(["disconnect"], true);
            warp(["registration", "delete"], true);
            warp(["registration", "new"], true);
            warp(["connect"], true);
          };

          const parseWg = (text) => {
            const priv = /PrivateKey\s*=\s*(\S+)/i.exec(text);
            const addr = /Address\s*=\s*(\S+)/i.exec(text);
            const pub = /PublicKey\s*=\s*(\S+)/i.exec(text);
            const ep = /Endpoint\s*=\s*(\S+)/i.exec(text);
            if (!priv || !addr || !pub || !ep) return null;
            const reserved = /Reserved\s*=\s*([0-9,\s]+)/i.exec(text);
            return {
              privateKey: priv[1],
              ipv6: addr[1],
              peerKey: pub[1],
              peerHost: ep[1].replace(/:(\d+)$/, ""),
              peerPort: Number(/:(\d+)$/.exec(ep[1])?.[1] || 2408),
              reserved: reserved
                ? reserved[1].split(",").map((n) => Number(n.trim())).filter((n) => !Number.isNaN(n)).slice(0, 3)
                : null,
            };
          };

          // Reserved bytes are not printed by every warp-cli build. Dig them out
          // of warp-svc state when the tunnel config omits them.
          const reservedFromState = () => {
            const cands = [
              "/var/lib/cloudflare-warp",
              "/etc/cloudflare-warp",
              "/var/lib/warp-svc",
              "/opt/cloudflare-warp",
            ];
            for (const dir of cands) {
              let files = [];
              try { files = execFileSync("sudo", ["find", dir, "-type", "f"], { encoding: "utf8" }).split("\n"); }
              catch { continue; }
              for (const f of files.filter(Boolean)) {
                let txt = "";
                try { txt = execFileSync("sudo", ["cat", f], { encoding: "utf8", timeout: 15000 }); } catch { continue; }
                const m = /reserved["'\s:=]+([0-9]+)\s*,\s*([0-9]+)\s*,\s*([0-9]+)/i.exec(txt);
                if (m) return [Number(m[1]), Number(m[2]), Number(m[3])];
              }
            }
            return null;
          };

          // Egress IPv4 as seen from inside the tunnel. This is the value that
          // determines which upstream rate-limit bucket a lane lands in.
          const egressIpv4 = () => {
            try {
              const t = warp(["tunnel", "wireguard", "show"], true) || "";
              return /IPv4\s*=\s*(\S+)/i.exec(t)?.[1] || null;
            } catch { return null; }
          };

          for (let i = 0; i < PER_WORKER; i++) {
            console.log(`[w${WORKER}] rotation ${i + 1}/${PER_WORKER}`);
            rotate();

            let parsed = null;
            for (let a = 0; a < 6 && !parsed; a++) {
              const show = warp(["tunnel", "wireguard", "show"], true) || "";
              parsed = parseWg(show);
              if (!parsed) {
                const alt = warp(["tunnel", "wireguard", "export"], true) || "";
                parsed = parseWg(alt);
              }
              if (!parsed) { console.log(`[w${WORKER}] config not ready, retry ${a + 1}`); warp(["connect"], true); await new Promise((r) => setTimeout(r, 8000)); }
            }

            if (!parsed) { console.log(`[w${WORKER}] rotation ${i + 1}: could not read wireguard config`); continue; }
            if (!parsed.reserved || parsed.reserved.length !== 3) {
              parsed.reserved = reservedFromState();
              console.log(`[w${WORKER}] reserved from state: ${JSON.stringify(parsed.reserved)}`);
            }

            const acct = {
              accountId: parsed.peerKey ? cryptoRandomId() : "unknown",
              token: "",
              privateKey: parsed.privateKey,
              reserved: parsed.reserved || [0, 0, 0],
              ipv6: parsed.ipv6.replace("/128", ""),
              peerKey: parsed.peerKey,
              peerHost: parsed.peerHost,
              peerPort: parsed.peerPort,
              createdAt: new Date().toISOString(),
              egressIpv4: null,
              source: "warp-cli",
              worker: WORKER,
              rotation: i + 1,
            };
            acct.egressIpv4 = egressIpv4();
            console.log(`[w${WORKER}] v6=${acct.ipv6} v4=${acct.egressIpv4 || "unknown"}`);
            out.push(acct);
            fs.writeFileSync("data/collected.json", JSON.stringify(out, null, 1));
            await new Promise((r) => setTimeout(r, 12000));
          }

          function cryptoRandomId() {
            const c = require("node:crypto");
            return c.randomUUID();
          }

          fs.writeFileSync("data/collected.json", JSON.stringify(out, null, 1));
          console.log(`[w${WORKER}] collected ${out.length}`);
          NODEEOF

          node harvest.js || echo "harvest exited nonzero"
          echo "--- collected ---"
          cat data/collected.json 2>/dev/null | head -c 400 || echo "none"

      - name: Verify each account with a real upstream request
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          set -uo pipefail
          cat > verify.js <<'NODEEOF'
          const { execFileSync, spawn } = require("node:child_process");
          const fs = require("node:fs");

          const SB = process.env.SB_PATH || "sing-box";
          const raw = fs.existsSync("data/collected.json") ? fs.readFileSync("data/collected.json", "utf8") : "[]";
          const accts = JSON.parse(raw || "[]");

          // Ask a service what address the tunnel exits from.
          const probeEgress = (a, port) => new Promise((resolve) => {
            const cfgPath = `/tmp/wg-${port}.json`;
            const cfg = {
              log: { level: "error" },
              dns: { servers: [{ tag: "cf", address: "https://1.1.1.1/dns-query" }], strategy: "ipv4_only" },
              inbounds: [{ type: "mixed", tag: "in", listen: "127.0.0.1", listen_port: port }],
              endpoints: [{
                type: "wireguard", tag: "wg",
                address: ["172.16.0.2/32", a.ipv6 + "/128"],
                private_key: a.privateKey,
                peers: [{
                  address: a.peerHost, port: a.peerPort, public_key: a.peerKey,
                  allowed_ips: ["0.0.0.0/0", "::/0"],
                  reserved: a.reserved,
                }],
              }],
              outbounds: [{ type: "direct", tag: "direct" }],
              route: { rules: [{ inbound: "in", outbound: "wg" }] },
            };
            fs.writeFileSync(cfgPath, JSON.stringify(cfg));
            const p = spawn(SB, ["run", "-c", cfgPath], { stdio: ["ignore", "ignore", "pipe"] });
            let err = "";
            p.stderr.on("data", (d) => { err += d; });
            setTimeout(async () => {
              try {
                const out = execFileSync("curl", [
                  "-s", "--max-time", "20", "--socks5-hostname", `127.0.0.1:${port}`,
                  "https://api.ipify.org",
                ], { encoding: "utf8", timeout: 30000 }).trim();
                p.kill("SIGKILL");
                resolve({ v4: out || null, err });
              } catch (e) {
                p.kill("SIGKILL");
                resolve({ v4: null, err: err.replace(/\x1b\[[0-9;]*m/g, "").slice(0, 120) });
              }
            }, 9000);
          });

          (async () => {
            const usable = [];
            let port = 45000 + Math.floor(Number(process.env.WORKER || 0)) * 10;
            for (const a of accts) {
              const { v4, err } = await probeEgress(a, port++);
              const ok = v4 && /^\d+\.\d+\.\d+\.\d+$/.test(v4);
              console.log(`acct=${a.accountId.slice(0, 8)} v6=${a.ipv6} egress=${v4 || "FAIL"} ${ok ? "USABLE" : err}`);
              if (ok) {
                a.egressIpv4 = v4;
                a.verified = true;
                usable.push(a);
              }
              await new Promise((r) => setTimeout(r, 2000));
            }
            fs.writeFileSync("data/usable.json", JSON.stringify(usable, null, 1));
            console.log(`usable ${usable.length}/${accts.length}`);
          })();
          NODEEOF
          # sing-box is not preinstalled on runners; grab it so tunnels can be verified.
          if ! command -v sing-box >/dev/null 2>&1; then
            curl -fsSL -o /tmp/sb.tgz https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-linux-amd64.tar.gz \
              && tar -xzf /tmp/sb.tgz -C /tmp \
              && sudo install -m 0755 /tmp/sing-box-1.11.4-linux-amd64/sing-box /usr/local/bin/sing-box \
              || echo "sing-box download failed"
          fi
          node verify.js || echo "verify exited nonzero"

      - name: Commit accounts
        env:
          WORKER: ${{ matrix.worker }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p "$ACCOUNTS_DIR"
          if [ ! -s data/usable.json ]; then
            echo "no verified accounts from worker $WORKER"
            exit 0
          fi
          RUN_ID="${{ github.run_id }}"
          python3 - <<'PYEOF'
          import json, os, pathlib
          data = json.load(open("data/usable.json"))
          d = pathlib.Path(os.environ["ACCOUNTS_DIR"])
          out = []
          for a in data:
              a.pop("verified", None)
              out.append(a)
              if len(out) >= 5:
                  break
          fn = d / f"cli-r{os.environ.get('RUN_ID','0')}-w{os.environ['WORKER']}.json"
          fn.write_text(json.dumps({"accounts": out}, indent=1))
          print("wrote", fn, len(out))
          PYEOF
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ACCOUNTS_DIR" || true
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "warp-cli re-registrations from worker $WORKER (run ${{ github.run_id }})"
            for attempt in 1 2 3 4 5; do
              if git push; then echo "pushed"; break; fi
              echo "push attempt $attempt failed, rebasing"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
              sleep 5
            done
          fi
