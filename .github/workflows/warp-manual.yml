name: warp-manual

# Rotates Cloudflare WARP registrations to obtain fresh egress IPs.
#
# Mechanism mirrors alztrk/opencode-ip-rotator: a FULL device re-registration
# (registration delete + registration new), not a reconnect. Each Actions job
# runs on its own fresh VM (fresh /etc/machine-id), which is what produces
# distinct egress addresses.
#
# Every account is verified by standing up a real tunnel and asking an external
# service what address it exits with. Only verified accounts are committed, and
# each record carries egressIpv4 so bucket diversity can be measured later.

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel jobs (each on its own fresh VM)'
        required: true
        default: '8'
      accounts_per_worker:
        description: 'Full re-registrations per job'
        required: true
        default: '3'

permissions:
  contents: write

concurrency:
  group: warp-manual
  cancel-in-progress: false

env:
  ACCOUNTS_DIR: accounts

jobs:
  plan:
    name: plan-matrix
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.make.outputs.worker }}
    steps:
      - id: make
        env:
          WORKERS: ${{ inputs.workers }}
        run: |
          set -euo pipefail
          n=$(printf '%s' "$WORKERS" | tr -cd '0-9')
          [ -z "$n" ] && n=8
          [ "$n" -gt 20 ] && n=20
          list=""
          i=0
          while [ "$i" -lt "$n" ]; do
            list="$list${list:+,}$i"
            i=$((i + 1))
          done
          echo "worker=[$list]" >> "$GITHUB_OUTPUT"

  mint:
    needs: plan
    name: mint-${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.worker) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cloudflare WARP CLI
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl gnupg lsb-release iproute2 ca-certificates
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo warp-cli --accept-tos --version

      - name: Discover warp-cli command surface
        id: probe
        run: |
          set -uo pipefail
          sudo systemctl enable dbus >/dev/null 2>&1 || true
          sudo systemctl start  dbus >/dev/null 2>&1 || true
          # warp-svc writes as root; keep its log somewhere writable by us.
          sudo systemctl start warp-svc >/dev/null 2>&1 || \
            { sudo warp-svc >/tmp/warp-svc.log 2>&1 & }
          for i in $(seq 1 25); do
            sudo warp-cli --accept-tos status >/dev/null 2>&1 && break
            sleep 2
          done

          # This build rejected `tunnel protocol wireguard`, so ask the binary
          # itself which spellings exist rather than guessing.
          {
            echo "### warp-cli tunnel protocol --help"
            sudo warp-cli --accept-tos tunnel protocol --help 2>&1 || true
            echo
            echo "### warp-cli tunnel --help"
            sudo warp-cli --accept-tos tunnel --help 2>&1 || true
            echo
            echo "### warp-cli tunnel wireguard --help"
            sudo warp-cli --accept-tos tunnel wireguard --help 2>&1 || true
            echo
            echo "### warp-cli status"
            sudo warp-cli --accept-tos status 2>&1 || true
          } | tee probe.txt

      - name: Register device
        run: |
          set -uo pipefail
          sudo warp-cli --accept-tos mode warp || true
          # Only set WireGuard when this build actually supports the subcommand.
          if sudo warp-cli --accept-tos tunnel protocol wireguard >/dev/null 2>&1; then
            echo "wireguard protocol set"
          else
            echo "this warp-cli build has no 'tunnel protocol wireguard'; leaving default"
          fi
          sudo warp-cli --accept-tos registration new 2>&1 || true
          sudo warp-cli --accept-tos connect 2>&1 || true
          sleep 5
          sudo warp-cli --accept-tos status 2>&1 || true

      - name: Rotate and harvest
        env:
          WORKER: ${{ matrix.worker }}
          PER_WORKER: ${{ fromJSON(inputs.accounts_per_worker) }}
        run: |
          set -uo pipefail
          mkdir -p data

          cat > harvest.cjs <<'NODEEOF'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          const PER_WORKER = Math.max(1, Number(process.env.PER_WORKER || 3));
          const WORKER = process.env.WORKER || "0";
          const out = [];

          // shell:false, explicit args. Never pass "wireguard" blindly: this
          // warp-cli build rejects it, so each candidate is tried and the
          // failure is tolerated.
          const warp = (args) => {
            try {
              return execFileSync("sudo", ["warp-cli", "--accept-tos", ...args], {
                encoding: "utf8", timeout: 90000, stdio: ["ignore", "pipe", "pipe"],
              });
            } catch (e) {
              return String((e && e.stdout) || "") + String((e && e.stderr) || "");
            }
          };

          // Try the plausible spellings for "dump the wireguard config" and
          // keep the first that yields a private key + peer public key.
          const CONFIG_CMDS = [
            ["tunnel", "wireguard", "show"],
            ["tunnel", "wireguard", "export"],
            ["tunnel", "config"],
            ["tunnel", "show"],
          ];

          const parseWg = (text) => {
            if (!text) return null;
            const priv = /PrivateKey\s*=\s*(\S+)/i.exec(text);
            const pub = /PublicKey\s*=\s*(\S+)/i.exec(text);
            const ep = /Endpoint\s*=\s*(\S+)/i.exec(text);
            if (!priv || !pub || !ep) return null;
            const addrs = [...text.matchAll(/Address\s*=\s*(\S+)/gi)].map((m) => m[1]);
            const v6 = addrs.find((a) => a.includes(":")) || addrs[0];
            if (!v6) return null;
            const resv = /Reserved\s*=\s*([0-9,\s]+)/i.exec(text);
            return {
              privateKey: priv[1],
              ipv6: v6.replace("/128", ""),
              peerKey: pub[1],
              peerHost: ep[1].replace(/:\d+$/, ""),
              peerPort: Number(/:\d+$/.exec(ep[1]) ? /:\d+$/.exec(ep[1])[0].slice(1) : 2408),
              reserved: resv
                ? resv[1].split(",").map((n) => Number(n.trim())).filter((n) => Number.isFinite(n)).slice(0, 3)
                : null,
            };
          };

          const readConfig = () => {
            for (const cmd of CONFIG_CMDS) {
              const parsed = parseWg(warp(cmd));
              if (parsed) { parsed.cmd = cmd.join(" "); return parsed; }
            }
            return null;
          };

          // Reserved bytes live in warp-svc state on builds that omit them.
          const reservedFromState = () => {
            const dirs = ["/var/lib/cloudflare-warp", "/etc/cloudflare-warp", "/var/lib/warp-svc"];
            for (const dir of dirs) {
              let files = [];
              try { files = execFileSync("sudo", ["find", dir, "-type", "f"], { encoding: "utf8" }).split("\n"); }
              catch { continue; }
              for (const f of files.filter(Boolean)) {
                let txt = "";
                try { txt = execFileSync("sudo", ["cat", f], { encoding: "utf8", timeout: 20000, maxBuffer: 8 << 20 }); }
                catch { continue; }
                const m = /reserved["'\s:=\[]+([0-9]{1,3})\s*,\s*([0-9]{1,3})\s*,\s*([0-9]{1,3})/i.exec(txt);
                if (m) return [Number(m[1]), Number(m[2]), Number(m[3])];
              }
            }
            return null;
          };

          const isConnected = () => /connected/i.test(warp(["status"]));

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          // The alztrk rotation: full device re-registration.
          const rotate = () => {
            warp(["disconnect"]);
            warp(["registration", "delete"]);
            warp(["registration", "new"]);
            warp(["connect"]);
          };

          (async () => {
            for (let i = 0; i < PER_WORKER; i++) {
              console.log(`[w${WORKER}] rotation ${i + 1}/${PER_WORKER}`);
              rotate();

              let parsed = null;
              for (let a = 0; a < 8 && !parsed; a++) {
                if (!isConnected()) { warp(["connect"]); await sleep(7000); }
                parsed = readConfig();
                if (!parsed) { console.log(`[w${WORKER}] config unavailable, retry ${a + 1}`); await sleep(6000); }
              }

              if (!parsed) {
                console.log(`[w${WORKER}] rotation ${i + 1}: FAILED to read wireguard config`);
                continue;
              }

              if (!parsed.reserved || parsed.reserved.length !== 3) {
                parsed.reserved = reservedFromState();
                console.log(`[w${WORKER}] reserved via state: ${JSON.stringify(parsed.reserved)}`);
              }

              const acct = {
                accountId: crypto.randomUUID(),
                token: "",
                privateKey: parsed.privateKey,
                reserved: parsed.reserved || [0, 0, 0],
                ipv6: parsed.ipv6,
                peerKey: parsed.peerKey,
                peerHost: parsed.peerHost,
                peerPort: parsed.peerPort,
                createdAt: new Date().toISOString(),
                egressIpv4: null,
                source: "warp-cli",
                worker: WORKER,
                rotation: i + 1,
                configCmd: parsed.cmd,
              };
              console.log(`[w${WORKER}] v6=${acct.ipv6} reserved=${JSON.stringify(acct.reserved)} via "${parsed.cmd}"`);
              out.push(acct);
              fs.writeFileSync("data/collected.json", JSON.stringify(out, null, 1));
              if (i < PER_WORKER - 1) await sleep(10000);
            }

            fs.writeFileSync("data/collected.json", JSON.stringify(out, null, 1));
            console.log(`[w${WORKER}] collected ${out.length}`);
          })();
          NODEEOF

          node harvest.cjs || echo "harvest exited nonzero"
          echo "--- collected ---"
          head -c 500 data/collected.json 2>/dev/null || echo none

      - name: Install sing-box for verification
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sb.tgz \
            https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-linux-amd64.tar.gz
          tar -xzf /tmp/sb.tgz -C /tmp
          sudo install -m 0755 /tmp/sing-box-1.11.4-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version | head -1

      - name: Verify egress per account
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          set -uo pipefail

          cat > verify.cjs <<'NODEEOF'
          const { execFileSync, spawn } = require("node:child_process");
          const fs = require("node:fs");

          const raw = fs.existsSync("data/collected.json")
            ? fs.readFileSync("data/collected.json", "utf8") : "[]";
          let accts = [];
          try { accts = JSON.parse(raw || "[]"); } catch { accts = []; }

          const probe = (a, port) => new Promise((resolve) => {
            const cfgPath = `/tmp/wg-${port}.json`;
            fs.writeFileSync(cfgPath, JSON.stringify({
              log: { level: "error" },
              dns: { servers: [{ tag: "cf", address: "https://1.1.1.1/dns-query" }], strategy: "ipv4_only" },
              inbounds: [{ type: "mixed", tag: "in", listen: "127.0.0.1", listen_port: port }],
              endpoints: [{
                type: "wireguard", tag: "wg",
                address: ["172.16.0.2/32", a.ipv6 + "/128"],
                private_key: a.privateKey,
                peers: [{
                  address: a.peerHost, port: a.peerPort, public_key: a.peerKey,
                  allowed_ips: ["0.0.0.0/0", "::/0"], reserved: a.reserved,
                }],
              }],
              outbounds: [{ type: "direct", tag: "direct" }],
              route: { rules: [{ inbound: "in", outbound: "wg" }] },
            }));
            const p = spawn("sing-box", ["run", "-c", cfgPath], { stdio: ["ignore", "ignore", "pipe"] });
            let err = "";
            p.stderr.on("data", (d) => { err += d; });
            setTimeout(() => {
              try {
                const out = execFileSync("curl", [
                  "-s", "--max-time", "20", "--socks5-hostname", "127.0.0.1:" + port,
                  "https://api.ipify.org",
                ], { encoding: "utf8", timeout: 30000 }).trim();
                p.kill("SIGKILL");
                resolve({ v4: out || null, err });
              } catch (e) {
                p.kill("SIGKILL");
                resolve({ v4: null, err: err.replace(/\x1b\[[0-9;]*m/g, "").slice(0, 140) });
              }
            }, 9000);
          });

          (async () => {
            const usable = [];
            let port = 45000 + Math.floor(Number(process.env.WORKER || 0)) * 10;
            for (const a of accts) {
              const { v4, err } = await probe(a, port++);
              const ok = !!v4 && /^\d+\.\d+\.\d+\.\d+$/.test(v4);
              console.log(`acct=${a.accountId.slice(0, 8)} v6=${a.ipv6} egress=${v4 || "FAIL"} ${ok ? "USABLE" : "DROP " + err}`);
              if (ok) { a.egressIpv4 = v4; a.verified = true; usable.push(a); }
              await new Promise((r) => setTimeout(r, 2000));
            }
            fs.writeFileSync("data/usable.json", JSON.stringify(usable, null, 1));
            const uniq = new Set(usable.map((u) => u.egressIpv4));
            console.log(`usable ${usable.length}/${accts.length} | distinct egress v4 in this worker: ${uniq.size}`);
          })();
          NODEEOF

          node verify.cjs || echo "verify exited nonzero"

      - name: Commit verified accounts
        env:
          WORKER: ${{ matrix.worker }}
          RUN_ID: ${{ github.run_id }}
          ACCOUNTS_DIR: accounts
        run: |
          set -uo pipefail
          mkdir -p "$ACCOUNTS_DIR"
          if [ ! -s data/usable.json ]; then
            echo "no verified accounts from worker $WORKER"
            exit 0
          fi
          python3 - <<'PYEOF'
          import json, os, pathlib
          data = json.load(open("data/usable.json"))
          d = pathlib.Path(os.environ["ACCOUNTS_DIR"])
          out = []
          for a in data:
              a.pop("verified", None)
              out.append(a)
              if len(out) >= 5:
                  break
          fn = d / f"cli-r{os.environ['RUN_ID']}-w{os.environ['WORKER']}.json"
          fn.write_text(json.dumps({"accounts": out}, indent=1))
          print("wrote", fn, len(out))
          PYEOF
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ACCOUNTS_DIR"
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "warp-cli re-registrations from worker $WORKER (run $RUN_ID)"
            for attempt in 1 2 3 4 5; do
              if git push; then echo "pushed"; break; fi
              echo "push attempt $attempt failed, rebasing"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
              sleep 5
            done
          fi
