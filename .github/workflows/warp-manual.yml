name: Mint WARP Lanes (fixed)

permissions:
  contents: write

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel runners (distinct Azure IPs)'
        required: true
        default: '5000'
      accounts_per_worker:
        description: 'Accounts per worker (<=5 per IP per minute)'
        required: true
        default: '5'

concurrency:
  group: warp-fixed-minter
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          COUNT="${{ github.event.inputs.workers || '5' }}"
          MATRIX_JSON=$(node -e "console.log(JSON.stringify(Array.from({ length: Number('$COUNT') }, (_, i) => i + 1)))")
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  mint:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Mint and ship lanes
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKER_ID: ${{ matrix.worker }}
          RUN_ID: ${{ github.run_id }}
          COUNT: ${{ github.event.inputs.accounts_per_worker || '5' }}
        run: |
          node -e '
          const crypto = require("node:crypto");
          const https = require("node:https");
          const postJson = (url, data, headers = {}, timeoutMs = 30000) => new Promise((resolve, reject) => {
            const u = new URL(url);
            const body = JSON.stringify(data);
            const req = https.request({
              hostname: u.hostname, port: u.port || 443, path: u.pathname + u.search, method: "POST",
              headers: { "Content-Type": "application/json", "Content-Length": Buffer.byteLength(body), ...headers },
              timeout: timeoutMs,
            }, (res) => {
              let raw = "";
              res.on("data", (c) => raw += c);
              res.on("end", () => { try { resolve({ status: res.statusCode, data: JSON.parse(raw) }); }
                catch { resolve({ status: res.statusCode, raw }); } });
            });
            req.on("error", reject);
            req.on("timeout", () => { req.destroy(); reject(new Error("timeout")); });
            req.write(body); req.end();
          });
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          (async () => {
            const target = Number(process.env.COUNT) || 5;
            const accounts = [];
            for (let i = 0; i < target; i++) {
              const { privateKey, publicKey } = crypto.generateKeyPairSync("x25519", {
                publicKeyEncoding: { type: "spki", format: "der" },
                privateKeyEncoding: { type: "pkcs8", format: "der" },
              });
              const privB64 = privateKey.subarray(-32).toString("base64");
              const pubB64 = publicKey.subarray(-32).toString("base64");
              const installId = crypto.randomUUID();
              let res;
              try {
                res = await postJson("https://api.cloudflareclient.com/v0a4005/reg", {
                  install_id: installId,
                  fcm_token: installId + ":APA91b" + crypto.randomBytes(32).toString("base64url"),
                  tos: new Date().toISOString().slice(0, 19) + ".000Z",
                  model: "PC", serial_number: installId, locale: "en_US", key: pubB64,
                }, { "User-Agent": "okhttp/4.12.0" });
              } catch (e) { console.error("net error, stopping job:", e.message); break; }
              if (res.status === 429) { console.log("throttled, stopping job (cron resumes)"); break; }
              if (res.status !== 200 || !res.data?.id || !res.data?.config) { console.error("reg failed:", res.status); break; }
              const j = res.data;
              accounts.push({
                accountId: j.id, token: j.token, privateKey: privB64,
                reserved: [...Buffer.from(j.config.client_id, "base64")],
                ipv6: j.config.interface.addresses.v6,
                peerKey: j.config.peers[0].public_key,
                peerHost: "engage.cloudflareclient.com", peerPort: 2408,
                createdAt: new Date().toISOString(),
              });
              process.stdout.write("+");
              await sleep(5000); // Azure runners sustain this pace; stop-on-429 guards the rest
            }
            console.log(`\nminted ${accounts.length}, committing to repo...`);
            if (!accounts.length) return;
            // Direction 1 (primary): push straight to the panel (instant).
            const headers = { "x-import-secret": process.env.IMPORT_SECRET };
            const payload = { version: 1, accounts };
            const base = ((process.env.PANEL_URL || "").trim() || "http://160.187.210.9:25566").replace(/\/+$/, "");
            try {
              const out = await postJson(base + "/app/import", payload, headers);
              console.log("panel push:", out.status, JSON.stringify(out.data).slice(0, 160));
            } catch (e) {
              console.error("panel push failed (pull will cover it): " + e.message);
            }
            // Direction 2 (fallback): commit this workers batch so the panel
            // pulls it even when runners cannot reach the panel inbound.
            try {
              const repo = process.env.GH_REPO;
              // Unique per run+worker: concurrent runs (cron + manual) can
              // never collide on the same file. Panel dedupes by accountId,
              // so re-pulled or overlapping batches are harmless.
              const filePath = `accounts/r${process.env.RUN_ID || "local"}-w${process.env.WORKER_ID || "0"}.json`;
              const putBody = {
                message: `warp accounts batch run ${process.env.RUN_ID || "local"} worker ${process.env.WORKER_ID || "0"}`,
                content: Buffer.from(JSON.stringify(payload)).toString("base64"),
              };
              const put = await new Promise((resolve, reject) => {
                const https = require("node:https");
                const data = JSON.stringify(putBody);
                const req = https.request(`https://api.github.com/repos/${repo}/contents/${filePath}`, {
                  method: "PUT",
                  headers: { "Content-Type": "application/json", "Content-Length": Buffer.byteLength(data),
                    Authorization: "Bearer " + process.env.GH_TOKEN, Accept: "application/vnd.github+json", "User-Agent": "warp-minter" },
                }, (res) => {
                  let raw = "";
                  res.on("data", (c) => { raw += c; });
                  res.on("end", () => resolve({ status: res.statusCode, raw: raw.slice(0, 200) }));
                });
                req.on("error", reject);
                req.write(data); req.end();
              });
              console.log("repo commit:", put.status);
            } catch (e) {
              console.error("repo commit failed: " + e.message);
            }
          })().catch((e) => { console.error("failed:", e); process.exit(1); });
          '
