name: warp-manual

# Does a fresh Cloudflare WARP registration hand out a fresh IPv4 egress?
#
# Registration uses the raw /v0a4005/reg API because that is the only path that
# exposes WireGuard credentials on current warp-cli builds (2026.7 is MASQUE-only
# and has no `tunnel wireguard` subcommand, so keys cannot be exported at all).
#
# Each job registers on its own fresh GitHub-hosted VM, stands the tunnel up with
# sing-box, and asks an external service what address it exits from. A summary
# job then reports how many DISTINCT v4 addresses the whole run produced --
# that number decides whether the fleet can be multiplied.

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel jobs (each on its own fresh VM)'
        required: true
        default: '6'
      accounts_per_worker:
        description: 'Registrations per job'
        required: true
        default: '2'
      pace_seconds:
        description: 'Seconds between registrations (window is ~1 min)'
        required: true
        default: '70'

permissions:
  contents: write

concurrency:
  group: warp-manual
  cancel-in-progress: false

env:
  ACCOUNTS_DIR: accounts

jobs:
  plan:
    name: plan-matrix
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.make.outputs.worker }}
    steps:
      - id: make
        env:
          WORKERS: ${{ inputs.workers }}
        run: |
          set -euo pipefail
          n=$(printf '%s' "$WORKERS" | tr -cd '0-9')
          [ -z "$n" ] && n=6
          [ "$n" -gt 20 ] && n=20
          list=""
          i=0
          while [ "$i" -lt "$n" ]; do
            list="$list${list:+,}$i"
            i=$((i + 1))
          done
          echo "worker=[$list]" >> "$GITHUB_OUTPUT"

  mint:
    needs: plan
    name: mint-${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.worker) }}
    steps:
      - name: Install sing-box
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sb.tgz \
            https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-linux-amd64.tar.gz
          tar -xzf /tmp/sb.tgz -C /tmp
          sudo install -m 0755 /tmp/sing-box-1.11.4-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version | head -1

      - name: Register and measure egress
        env:
          WORKER: ${{ matrix.worker }}
          PER_WORKER: ${{ fromJSON(inputs.accounts_per_worker) }}
          PACE_SECONDS: ${{ fromJSON(inputs.pace_seconds) }}
        run: |
          set -uo pipefail
          mkdir -p data

          cat > measure.cjs <<'NODEEOF'
          const https = require("node:https");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const { spawn, execFileSync } = require("node:child_process");

          const PER_WORKER = Math.max(1, Number(process.env.PER_WORKER || 2));
          const PACE_MS = Math.max(60000, Number(process.env.PACE_SECONDS || 70) * 1000);
          const WORKER = process.env.WORKER || "0";
          const PORT = 45000 + Number(WORKER) * 10;
          const rows = [];
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const log = (...a) => console.log(...a);

          const postJson = (bodyObj) => new Promise((resolve) => {
            const data = JSON.stringify(bodyObj);
            const req = https.request({
              hostname: "api.cloudflareclient.com", path: "/v0a4005/reg", method: "POST",
              headers: { "Content-Type": "application/json", "Content-Length": Buffer.byteLength(data), "User-Agent": "okhttp/4.12.0" },
              timeout: 25000,
            }, (res) => {
              let b = ""; res.on("data", (c) => b += c);
              res.on("end", () => { try { resolve({ status: res.statusCode, data: JSON.parse(b) }); } catch { resolve({ status: res.statusCode }); } });
            });
            req.on("error", (e) => resolve({ status: 0, err: e.code }));
            req.end();
          });

          const mint = async () => {
            const { publicKey, privateKey } = crypto.generateKeyPairSync("x25519", {
              publicKeyEncoding: { type: "spki", format: "der" },
              privateKeyEncoding: { type: "pkcs8", format: "der" },
            });
            const installId = crypto.randomUUID();
            const res = await postJson({
              install_id: installId,
              fcm_token: installId + ":APA91b" + crypto.randomBytes(32).toString("base64url"),
              tos: new Date().toISOString().slice(0, 19) + ".000Z",
              model: "PC", serial_number: installId, locale: "en_US",
              key: publicKey.subarray(-32).toString("base64"),
            });
            if (res.status !== 200 || !res.data || !res.data.config) {
              return { fail: true, status: res.status, err: res.err };
            }
            const j = res.data;
            return {
              accountId: j.id, token: j.token,
              privateKey: privateKey.subarray(-32).toString("base64"),
              reserved: [...Buffer.from(j.config.client_id, "base64")],
              ipv6: j.config.interface.addresses.v6,
              peerKey: j.config.peers[0].public_key,
              peerHost: "engage.cloudflareclient.com",
              peerPort: 2408,
              createdAt: new Date().toISOString(),
            };
          };

          const cfgFor = (a, port) => ({
            log: { level: "error" },
            dns: { servers: [{ tag: "cf", address: "https://1.1.1.1/dns-query" }], strategy: "ipv4_only" },
            inbounds: [{ type: "mixed", tag: "in", listen: "127.0.0.1", listen_port: port }],
            endpoints: [{ type: "wireguard", tag: "wg", address: ["172.16.0.2/32", a.ipv6 + "/128"],
              private_key: a.privateKey,
              peers: [{ address: a.peerHost, port: a.peerPort, public_key: a.peerKey,
                allowed_ips: ["0.0.0.0/0", "::/0"], reserved: a.reserved }] }],
            outbounds: [{ type: "direct", tag: "direct" }],
            route: { rules: [{ inbound: "in", outbound: "wg" }] },
          });

          // Force an IPv4 destination so the tunnel uses its v4 egress path.
          const v4Of = (port) => new Promise((res) => {
            try {
              res(execFileSync("curl", ["-s", "--max-time", "20", "--socks5-hostname",
                "127.0.0.1:" + port, "https://api.ipify.org"],
                { encoding: "utf8", timeout: 30000 }).trim());
            } catch { res(null); }
          });

          const runTunnel = async (a, port, tag) => {
            const f = "/tmp/wg-" + tag + ".json";
            fs.writeFileSync(f, JSON.stringify(cfgFor(a, port)));
            const p = spawn("sing-box", ["run", "-c", f], { stdio: ["ignore", "ignore", "pipe"] });
            let err = ""; p.stderr.on("data", (d) => { err += d; });
            await sleep(8000);
            const v4 = await v4Of(port);
            p.kill("SIGKILL");
            await sleep(1500);
            return { v4, err: err.replace(/\x1b\[[0-9;]*m/g, "").slice(0, 100) };
          };

          (async () => {
            let refused = 0;
            for (let i = 0; i < PER_WORKER; i++) {
              const acct = await mint();
              if (!acct || acct.fail) {
                refused++;
                log("[w" + WORKER + "] #" + i + " register REFUSED status=" + (acct && acct.status) +
                    " err=" + (acct && acct.err) + " (refused " + refused + ")");
                if (refused >= 4) { log("[w" + WORKER + "] giving up after 4 refusals"); break; }
                await sleep(PACE_MS);
                continue;
              }
              refused = 0;
              const { v4, err } = await runTunnel(acct, PORT, WORKER + "-" + i);
              rows.push({ worker: WORKER, index: i, acctV6: acct.ipv6, egressV4: v4 });
              log("[w" + WORKER + "] #" + i + " acct-v6=" + acct.ipv6);
              log("[w" + WORKER + "] #" + i + " egressV4=" + (v4 || "FAIL") + (err ? "  " + err : ""));
              fs.writeFileSync("data/rows.json", JSON.stringify(rows, null, 1));
              if (i < PER_WORKER - 1) await sleep(PACE_MS);
            }

            fs.writeFileSync("data/rows.json", JSON.stringify(rows, null, 1));
            const v4s = rows.map((r) => r.egressV4).filter(Boolean);
            const uniq = new Set(v4s);
            log("[w" + WORKER + "] measured " + v4s.length + " -> " + uniq.size + " distinct v4");
            for (const v of uniq) log("[w" + WORKER + "]   " + v);
          })();
          NODEEOF

          node measure.cjs || echo "measure exited nonzero"
          echo "--- rows ---"
          cat data/rows.json 2>/dev/null || echo none

      - name: Publish results
        env:
          WORKER: ${{ matrix.worker }}
          ACCOUNTS_DIR: accounts
        run: |
          set -uo pipefail
          mkdir -p results
          cp data/rows.json "results/w$WORKER.json" 2>/dev/null || echo '[]' > "results/w$WORKER.json"
          cat "results/w$WORKER.json"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "egress v4 measurements from worker $WORKER"
            for attempt in 1 2 3 4 5; do
              if git push; then echo pushed; break; fi
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
              sleep 5
            done
          fi

  summary:
    needs: mint
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Tally distinct egress addresses
        run: |
          set -uo pipefail
          mkdir -p results
          python3 - << 'PYEOF'
          import json, glob, collections
          rows = []
          for f in sorted(glob.glob("results/w*.json")):
              try:
                  rows.extend(json.load(open(f)))
              except Exception as e:
                  print("skip", f, e)
          v4s = [r.get("egressV4") for r in rows if r.get("egressV4")]
          v6s = [r.get("acctV6") for r in rows if r.get("acctV6")]
          p48 = collections.Counter(":".join(v.split(":")[:3]) for v in v6s)
          print("=== registrations measured:", len(rows))
          print("=== distinct v4 egress   :", len(set(v4s)))
          print("=== distinct v6 /128     :", len(set(v6s)))
          print("=== distinct v6 /48      :", len(p48), dict(p48))
          print()
          print("v4 addresses:")
          for v, n in collections.Counter(v4s).most_common():
              print("  %-16s x%d" % (v, n))
          print()
          verdict = "INCONCLUSIVE"
          if len(v4s) >= 3:
              verdict = ("registration DOES re-roll v4" if len(set(v4s)) >= len(v4s) * 0.8
                         else "registration does NOT re-roll v4")
          print("VERDICT:", verdict)
          open("results/SUMMARY.txt", "w").write(
              "measured=%d distinct_v4=%d distinct_v6=%d\nverdict=%s\n" %
              (len(rows), len(set(v4s)), len(set(v6s)), verdict))
          PYEOF
          echo
          cat results/SUMMARY.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results || true
          git diff --cached --quiet || git commit -q -m "egress summary" || true
          git push -q origin "${GITHUB_REF_NAME:-main}" || true