name: Mint WARP Accounts (Auto & Manual)

on:
  schedule:
    - cron: '*/5 * * * *' # Automatically runs every 5 minutes
  workflow_dispatch:      # Allows manual trigger anytime from the Actions tab
    inputs:
      workers:
        description: 'Number of parallel runners (each gets a different Azure IP, max 20)'
        required: true
        default: '20'
        type: choice
        options:
          - '5'   # 5 IPs  x 5 = 25 accounts
          - '10'  # 10 IPs x 5 = 50 accounts
          - '20' 
          - '60'
          - '100'
          - '150'
          - '200'
          
      
          
          # 20 IPs x 5 = 100 accounts
      accounts_per_worker:
        description: 'Accounts per worker (keep <= 5 to stay under the 1-min IP limit)'
        required: true
        default: '5'

# Prevent runs from overlapping if there is slight queue jitter
concurrency:
  group: warp-auto-minter
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          COUNT="${{ github.event.inputs.workers || '20' }}"
          MATRIX_JSON=$(node -e "console.log(JSON.stringify(Array.from({ length: Number('$COUNT') }, (_, i) => i + 1)))")
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  mint:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Mint & Ship to Panel
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
          WORKER_ID: ${{ matrix.worker }}
          COUNT: ${{ github.event.inputs.accounts_per_worker || '5' }}
        run: |
          node -e '
          const crypto = require("node:crypto");
          const http = require("node:http");
          const https = require("node:https");

          const postJson = (url, data, headers = {}, timeoutMs = 35000) => new Promise((resolve, reject) => {
            const u = new URL(url);
            const isHttps = u.protocol === "https:";
            const client = isHttps ? https : http;
            const body = JSON.stringify(data);
            
            const req = client.request({
              hostname: u.hostname,
              port: u.port || (isHttps ? 443 : 80),
              path: u.pathname + u.search,
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Content-Length": Buffer.byteLength(body),
                ...headers
              },
              timeout: timeoutMs,
              ...(isHttps ? { rejectUnauthorized: false } : {})
            }, (res) => {
              let raw = "";
              res.on("data", (c) => raw += c);
              res.on("end", () => {
                try { resolve({ status: res.statusCode, data: JSON.parse(raw) }); }
                catch { resolve({ status: res.statusCode, raw }); }
              });
            });
            req.on("error", reject);
            req.on("timeout", () => { req.destroy(); reject(new Error("Request timed out")); });
            req.write(body);
            req.end();
          });

          function generateWgKeyPair() {
            const { privateKey, publicKey } = crypto.generateKeyPairSync("x25519", {
              publicKeyEncoding: { type: "spki", format: "der" },
              privateKeyEncoding: { type: "pkcs8", format: "der" }
            });
            return {
              privateKey: privateKey.subarray(privateKey.length - 32).toString("base64"),
              publicKey: publicKey.subarray(publicKey.length - 32).toString("base64")
            };
          }

          async function registerWarp() {
            const { privateKey, publicKey } = generateWgKeyPair();
            const res = await postJson("https://api.cloudflareclient.com/v0a3160/reg", {
              install_id: "",
              tos: new Date().toISOString(),
              key: publicKey,
              fcm_token: "",
              type: "Android",
              locale: "en_US"
            }, {
              "User-Agent": "okhttp/3.12.1",
              "CF-Client-Version": "a-6.3-3160"
            });

            const r = res.data?.result || res.data;

            if (res.status !== 200 || !r || !r.id || !r.config) {
              throw new Error(`CF reg failed (${res.status}): ${JSON.stringify(res.data || res.raw)}`);
            }

            const peer = (r.config.peers && r.config.peers[0]) || {};
            const endpointHost = (peer.endpoint && peer.endpoint.host) || "162.159.192.1:2408";
            let peerHost = "162.159.192.1";
            let peerPort = 2408;

            if (endpointHost.includes(":") && !endpointHost.startsWith("[")) {
              const parts = endpointHost.split(":");
              peerHost = parts[0] || peerHost;
              peerPort = Number(parts[1]) || peerPort;
            } else {
              peerHost = endpointHost;
            }

            return {
              accountId: r.id,
              privateKey: privateKey,
              ipv6: r.config.interface.addresses.v6,
              reserved: r.config.client_id || [0, 0, 0],
              peerKey: peer.public_key || "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=",
              peerHost: peerHost,
              peerPort: peerPort
            };
          }

          async function shipWithRetry(targetUrl, lanes, headers, workerId, maxRetries = 3) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
              try {
                const res = await postJson(targetUrl, lanes, headers, 35000);
                return res;
              } catch (err) {
                console.warn(`[Worker ${workerId}] Ship attempt ${attempt}/${maxRetries} failed: ${err.message}`);
                if (attempt === maxRetries) throw err;
                // Wait 3s before retry
                await new Promise((r) => setTimeout(r, 3000));
              }
            }
          }

          async function main() {
            const worker = process.env.WORKER_ID;
            const panelUrl = (process.env.PANEL_URL || "").trim();
            const secret = (process.env.IMPORT_SECRET || "").trim();
            const target = Number(process.env.COUNT) || 5;

            if (!panelUrl) throw new Error("PANEL_URL secret is missing in GitHub repository settings");

            const lanes = [];
            console.log(`[Worker ${worker}] Minting ${target} WARP accounts on this runner IP...`);

            for (let i = 0; i < target; i++) {
              try {
                const lane = await registerWarp();
                lanes.push(lane);
                console.log(`[Worker ${worker}] Minted account ${i + 1}/${target} (id: ${lane.accountId})`);
              } catch (err) {
                console.error(`[Worker ${worker}] Failed to mint #${i + 1}: ${err.message}`);
              }
              await new Promise((r) => setTimeout(r, 2500));
            }

            if (lanes.length === 0) {
              console.log(`[Worker ${worker}] No lanes minted, skipping import.`);
              return;
            }

            // Stagger panel requests with 0-5s jitter to prevent thundering herd
            const jitterMs = Math.floor(Math.random() * 5000);
            await new Promise((r) => setTimeout(r, jitterMs));

            const targetUrl = `${panelUrl.replace(/\/+$/, "")}/app/import`;
            console.log(`[Worker ${worker}] Shipping ${lanes.length} lanes to panel (${targetUrl})...`);
            
            const headers = {};
            if (secret) {
              headers["x-import-secret"] = secret;
            }

            const res = await shipWithRetry(targetUrl, lanes, headers, worker, 3);
            console.log(`[Worker ${worker}] Panel import response (HTTP ${res.status}):`, JSON.stringify(res.data || res.raw));
          }

          main().catch((err) => {
            console.error("Worker error:", err);
            process.exit(1);
          });
          '
